<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목멱성 정기공연 합주 매칭 시스템</title>
    <!-- 엑셀 내보내기를 위한 SheetJS 라이브러리 추가 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: #f4f6f9; color: #333; max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { color: #2c3e50; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; max-width: 800px; margin-left: auto; margin-right: auto; }
        input[type="file"] { display: block; margin-bottom: 15px; width: 100%; }
        button { background-color: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        .export-btn { background-color: #27ae60; margin-top: 15px; display: none; }
        .export-btn:hover { background-color: #219653; }

        pre { background-color: #282c34; color: #abb2bf; padding: 15px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; font-family: 'Courier New', monospace; line-height: 1.5; max-width: 800px; margin-left: auto; margin-right: auto; }
        .status { margin-top: 10px; font-weight: bold; color: #e74c3c; text-align: center; }
        
        /* 테이블 스타일 */
        .table-container { margin-top: 15px; overflow-x: auto; padding-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background-color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; font-size: 14px; min-width: 700px; }
        th, td { border: 1px solid #bdc3c7; padding: 10px 5px; vertical-align: middle; }
        th { background-color: #fce4ec; color: #333; font-size: 16px; font-weight: bold; }
        .time-col { background-color: #fce4ec; font-size: 16px; font-weight: bold; width: 70px; }
        .role-col { background-color: #e8f5e9; font-weight: bold; width: 40px; color: #2e7d32; }
        .member-cell { min-width: 100px; cursor: pointer; transition: background-color 0.2s; }
        .member-cell:hover { background-color: #ffeaa7; }
        .empty-slot { color: #e74c3c; font-weight: bold; }

        /* 모달(팝업창) 스타일 */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); }
        .modal-content { background-color: #fff; margin: 10% auto; padding: 20px; border-radius: 12px; width: 90%; max-width: 450px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); max-height: 80vh; overflow-y: auto; }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; margin-top: -10px; }
        .close-btn:hover { color: #333; }
        .modal h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; font-size: 18px; }
        .applicant-list { list-style: none; padding: 0; margin: 0; }
        .applicant-list li { padding: 10px; border-bottom: 1px solid #ecf0f1; font-size: 15px; }
        .applicant-list li:last-child { border-bottom: none; }
        .tag-assigned { color: #2980b9; font-weight: bold; font-size: 0.9em; display: block; margin-top: 4px; }
        .tag-this { color: #27ae60; font-weight: bold; }
        .tag-unassigned { color: #7f8c8d; font-size: 0.9em; display: block; margin-top: 4px; }
    </style>
</head>
<body>

    <h1>🎸 목멱성 합주 매칭 자동화 시스템</h1>
    
    <div class="card">
        <p>구글 폼 등에서 다운로드한 <b>응답 CSV 파일</b>을 업로드해 주세요.</p>
        <input type="file" id="csvFileInput" accept=".csv">
        <button id="startBtn" onclick="processFile()">매칭 시뮬레이션 시작</button>
        <button id="exportBtn" class="export-btn" onclick="exportToExcel()">📥 엑셀(Excel)로 내보내기</button>
        <div id="statusText" class="status"></div>
    </div>

    <!-- 요약 로그 영역 -->
    <pre id="outputLog">여기에 요약 결과가 출력됩니다...</pre>

    <!-- 표 출력 영역 -->
    <div class="table-container" id="tableContainer"></div>

    <!-- 모달(팝업) 창 -->
    <div id="infoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle">지원자 명단</h3>
            <ul id="modalList" class="applicant-list"></ul>
        </div>
    </div>

    <script>
        const sessionMap = {
            '보컬': 'Vocal', '기타': 'Guitar', '일렉기타': 'Guitar',  
            '베이스': 'Bass', '드럼': 'Drum', '키보드': 'Keyboard'
        };
        const engToKor = {'Vocal': '보컬', 'Guitar': '기타', 'Bass': '베이스', 'Drum': '드럼', 'Keyboard': '키보드'};
        const shortRole = {'Vocal': 'V', 'Guitar': 'G', 'Bass': 'B', 'Drum': 'D', 'Keyboard': 'K'};
        const days = ['월', '화', '수', '목', '금'];
        const timeSlots = ['18-19', '19-20', '20-21', '21-22'];

        function timeSortKey(t_str) {
            const dayOrder = {'월': 1, '화': 2, '수': 3, '목': 4, '금': 5, '토': 6, '일': 7};
            const parts = t_str.split(' ');
            const day = parts[0];
            const timeVal = parts.length > 1 ? parts[1] : "";
            return [dayOrder[day] || 99, timeVal];
        }

        function parseCSV(csv) {
            const lines = csv.replace(/\r/g, '').trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            const result = [];
            
            for (let i = 1; i < lines.length; i++) {
                let obj = {};
                let currentLine = lines[i];
                if (!currentLine) continue;
                
                let row = [];
                let inQuotes = false;
                let val = '';
                for (let char of currentLine) {
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { row.push(val.trim()); val = ''; }
                    else val += char;
                }
                row.push(val.trim());
                
                headers.forEach((h, idx) => {
                    obj[h] = row[idx] ? row[idx].replace(/^"|"$/g, '').trim() : '';
                });
                result.push(obj);
            }
            return result;
        }

        function log(msg, append=true) {
            const out = document.getElementById('outputLog');
            if(append) out.textContent += msg + '\n';
            else out.textContent = msg + '\n';
        }

        async function processFile() {
            const fileInput = document.getElementById('csvFileInput');
            if (!fileInput.files.length) {
                alert("CSV 파일을 먼저 선택해 주세요.");
                return;
            }

            const btn = document.getElementById('startBtn');
            const exportBtn = document.getElementById('exportBtn');
            const statusText = document.getElementById('statusText');
            btn.disabled = true;
            exportBtn.style.display = "none";
            statusText.textContent = "수만 번의 시뮬레이션을 돌리는 중입니다. 약 3~5초 소요됩니다...";
            log("데이터를 읽는 중...", false);
            document.getElementById('tableContainer').innerHTML = ""; 

            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = async function(e) {
                const text = e.target.result;
                const parsedData = parseCSV(text);
                
                let studentData = {};
                parsedData.forEach(row => {
                    if(!row['이름']) return;
                    let name = row['이름'].trim();
                    let rawSessions = row['세션'].split(',');
                    let sessions = [];
                    rawSessions.forEach(s => {
                        let cleanS = s.trim();
                        if (sessionMap[cleanS]) sessions.push(sessionMap[cleanS]);
                    });
                    
                    studentData[name] = {
                        sessions: [...new Set(sessions)],
                        times: row['시간대'].split(',').map(t => t.trim())
                    };
                });

                setTimeout(() => runAlgorithm(studentData), 100);
            };
            reader.readAsText(file);
        }

        function runAlgorithm(studentData, iterations=20000) {
            let allTimesSet = new Set();
            let allRequests = new Set();
            let studentNames = Object.keys(studentData);
            
            studentNames.forEach(s => {
                studentData[s].times.forEach(t => allTimesSet.add(t));
                studentData[s].sessions.forEach(r => allRequests.add(`${s}|${r}`));
            });
            
            let allPossibleTimes = Array.from(allTimesSet).sort((a, b) => {
                let keyA = timeSortKey(a), keyB = timeSortKey(b);
                if(keyA[0] !== keyB[0]) return keyA[0] - keyB[0];
                return keyA[1].localeCompare(keyB[1]);
            });

            let bestScore = -Infinity;
            let bestAssignment = {};
            let bestFulfilled = new Set();
            let bestAssignmentCounts = {};

            log(`==============================`, false);
            log(`📊 [탐색 시작 전 데이터 확인]`);
            log(` - 총 지원자 수: ${studentNames.length}명`);
            log(` - 총 신청 세션 수: ${allRequests.size}건`);
            log(`==============================\n`);
            log(`[시스템] 알고리즘 최적화 탐색 중...`);

            for (let seed = 0; seed < iterations; seed++) {
                let timesShuffled = [...allPossibleTimes];
                timesShuffled.sort(() => Math.random() - 0.5);

                let fulfilledRequests = new Set();
                let studentAssignmentCount = {};
                studentNames.forEach(s => studentAssignmentCount[s] = 0);
                
                let results = {};
                allPossibleTimes.forEach(t => {
                    results[t] = {'Vocal': [], 'Guitar': [], 'Bass': [], 'Drum': [], 'Keyboard': []};
                });

                let assignedInT = {};
                allPossibleTimes.forEach(t => assignedInT[t] = new Set());

                for (let t of timesShuffled) {
                    let roleOrder = ['Drum', 'Bass', 'Vocal', 'Guitar'];
                    roleOrder.sort(() => Math.random() - 0.5);
                    
                    for (let role of roleOrder) {
                        let cands = studentNames.filter(s => 
                            studentData[s].times.includes(t) && 
                            studentData[s].sessions.includes(role) && 
                            !assignedInT[t].has(s) &&
                            !fulfilledRequests.has(`${s}|${role}`)
                        );
                        
                        if (cands.length > 0) {
                            cands.sort((a, b) => {
                                let valA = [studentAssignmentCount[a], studentData[a].times.length, Math.random()];
                                let valB = [studentAssignmentCount[b], studentData[b].times.length, Math.random()];
                                for(let i=0; i<3; i++) { if(valA[i] !== valB[i]) return valA[i] - valB[i]; }
                                return 0;
                            });
                            
                            let chosen = cands[0];
                            results[t][role].push(chosen);
                            assignedInT[t].add(chosen);
                            fulfilledRequests.add(`${chosen}|${role}`);
                            studentAssignmentCount[chosen]++;
                        } else {
                            results[t][role].push("🚨공석");
                        }
                    }
                }

                for (let t of timesShuffled) {
                    for (let optRole of ['Keyboard', 'Guitar']) {
                        let cands = studentNames.filter(s => 
                            studentData[s].times.includes(t) && 
                            studentData[s].sessions.includes(optRole) && 
                            !assignedInT[t].has(s) &&
                            !fulfilledRequests.has(`${s}|${optRole}`)
                        );
                        if (cands.length > 0) {
                            cands.sort((a, b) => {
                                let valA = [studentAssignmentCount[a], Math.random()];
                                let valB = [studentAssignmentCount[b], Math.random()];
                                for(let i=0; i<2; i++) { if(valA[i] !== valB[i]) return valA[i] - valB[i]; }
                                return 0;
                            });
                            let chosen = cands[0];
                            results[t][optRole].push(chosen);
                            assignedInT[t].add(chosen);
                            fulfilledRequests.add(`${chosen}|${optRole}`);
                            studentAssignmentCount[chosen]++;
                        }
                    }
                }

                let zeroAssignedStudents = studentNames.filter(s => studentAssignmentCount[s] === 0).length;
                let emptyMandatorySlots = 0;
                Object.values(results).forEach(team => {
                    ['Vocal', 'Guitar', 'Bass', 'Drum'].forEach(role => {
                        team[role].forEach(m => { if(m === "🚨공석") emptyMandatorySlots++; });
                    });
                });

                let fulfilledCount = fulfilledRequests.size;
                let score = (fulfilledCount * 10) - (emptyMandatorySlots * 500) - (zeroAssignedStudents * 10000);

                if (score > bestScore) {
                    bestScore = score;
                    bestAssignment = results;
                    bestFulfilled = new Set(fulfilledRequests);
                    bestAssignmentCounts = {...studentAssignmentCount};
                }
            }

            printResults(bestAssignment, bestFulfilled, allRequests, bestAssignmentCounts, studentNames, studentData);
        }

        function printResults(results, fulfilled, allRequests, counts, studentNames, studentData) {
            let zeroMembers = studentNames.filter(s => counts[s] === 0);
            let totalEmptySlots = 0;
            Object.values(results).forEach(team => {
                ['Vocal', 'Guitar', 'Bass', 'Drum'].forEach(role => {
                    team[role].forEach(m => { if(m === "🚨공석") totalEmptySlots++; });
                });
            });

            let unfulfilledMap = {};
            allRequests.forEach(req => {
                if(!fulfilled.has(req)) {
                    let [name, role] = req.split('|');
                    if(!unfulfilledMap[name]) unfulfilledMap[name] = [];
                    unfulfilledMap[name].push(engToKor[role]);
                }
            });

            window.currentMatchingData = { results, studentData, studentNames };
            
            let finalAssignments = {};
            studentNames.forEach(s => finalAssignments[s] = []);
            for (let t in results) {
                for (let role in results[t]) {
                    results[t][role].forEach(member => {
                        if (member !== "🚨공석") {
                            finalAssignments[member].push(`[${t}] ${engToKor[role]}`);
                        }
                    });
                }
            }
            window.finalAssignments = finalAssignments;

            log(`\n==============================`);
            log(`최종 배정 결과 요약`);
            log(`==============================`);
            log(`총 ${allRequests.size}건 중 ${fulfilled.size}건 배정 완료`);

            if (zeroMembers.length > 0) log(`\n배정되지 않은 부원: ${zeroMembers.join(', ')}`);
            else log(`\n전원 1회 이상 배정 완료`);

            if (totalEmptySlots > 0) log(`※ 물리적 지원자 부족으로 필수 포지션에 총 ${totalEmptySlots}자리 공석 발생`);

            if (Object.keys(unfulfilledMap).length > 0) {
                log(`\n⚠️ 미배정 세션 내역 (타 악기로는 배정됨)`);
                for (const [student, roles] of Object.entries(unfulfilledMap)) {
                    log(`   - ${student}: ${roles.join(', ')}`);
                }
            }
            log(`==============================\n💡 아래 테이블의 칸을 [클릭] 하시면 투표한 전체 지원자 명단을 확인 가능합니다!`);

            renderTable(results);

            document.getElementById('startBtn').disabled = false;
            document.getElementById('exportBtn').style.display = "block"; // 엑셀 내보내기 버튼 표시
            document.getElementById('statusText').textContent = "매칭 완료!";
            document.getElementById('statusText').style.color = "#27ae60";
        }

        function renderTable(results) {
            const tableContainer = document.getElementById('tableContainer');
            let tableHTML = `<table id="resultTable">
                <thead>
                    <tr>
                        <th colspan="2">시간대 / 요일</th>`;
            days.forEach(day => {
                tableHTML += `<th>${day}</th>`;
            });
            tableHTML += `</tr></thead><tbody>`;

            const rolesToRender = ['Vocal', 'Guitar', 'Bass', 'Drum', 'Keyboard'];

            timeSlots.forEach(time => {
                rolesToRender.forEach((role, idx) => {
                    tableHTML += `<tr>`;
                    if (idx === 0) tableHTML += `<td class="time-col" rowspan="5">${time}</td>`;
                    tableHTML += `<td class="role-col">${shortRole[role]}</td>`;

                    days.forEach(day => {
                        const timeKey = `${day} ${time}`;
                        let cellContent = "";
                        
                        if (results[timeKey] && results[timeKey][role]) {
                            cellContent = results[timeKey][role].join(', ');
                            if (cellContent.includes("🚨공석")) {
                                cellContent = `<span class="empty-slot">${cellContent}</span>`;
                            }
                        }

                        tableHTML += `<td class="member-cell" onclick="openModal('${timeKey}', '${role}')">${cellContent}</td>`;
                    });

                    tableHTML += `</tr>`;
                });
            });

            tableHTML += `</tbody></table>`;
            tableContainer.innerHTML = tableHTML;
        }

        // 💡 엑셀 내보내기 함수 (SheetJS 활용)
        function exportToExcel() {
            const table = document.getElementById("resultTable");
            if (!table) {
                alert("내보낼 표가 없습니다.");
                return;
            }
            // HTML 테이블을 엑셀 워크북으로 변환
            const wb = XLSX.utils.table_to_book(table, {sheet: "정기공연 매칭 결과"});
            // 파일 다운로드 실행
            XLSX.writeFile(wb, "목멱성_합주_매칭결과.xlsx");
        }

        function openModal(timeKey, role) {
            if(!window.currentMatchingData) return;
            const sData = window.currentMatchingData.studentData;
            const names = window.currentMatchingData.studentNames;
            
            let applicants = names.filter(s => 
                sData[s].times.includes(timeKey) && 
                sData[s].sessions.includes(role)
            );
            
            let listHTML = "";
            if (applicants.length === 0) {
                listHTML = "<li>해당 파트에 지원한 사람이 없습니다.</li>";
            } else {
                applicants.forEach(s => {
                    let assignedList = window.finalAssignments[s];
                    let assignedStr = assignedList.length > 0 ? assignedList.join(', ') : "미배정";
                    
                    let isThisSlot = assignedList.includes(`[${timeKey}] ${engToKor[role]}`);
                    
                    if (isThisSlot) {
                        listHTML += `<li>
                            <span class="tag-this">✔ ${s} (현재 칸 확정)</span>
                        </li>`;
                    } else {
                        listHTML += `<li>
                            ${s}
                            <span class="tag-assigned">▶ 타 배정: ${assignedStr}</span>
                        </li>`;
                    }
                });
            }

            document.getElementById('modalTitle').textContent = `[${timeKey}] ${engToKor[role]} 지원자 (${applicants.length}명)`;
            document.getElementById('modalList').innerHTML = listHTML;
            document.getElementById('infoModal').style.display = "block";
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = "none";
        }

        // 💡 1. 바탕 클릭 시 모달 닫기
        window.onclick = function(event) {
            let modal = document.getElementById('infoModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        // 💡 2. ESC 키 누를 시 모달 닫기
        window.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                closeModal();
            }
        });
    </script>
</body>
</html>
