<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목멱성 정기공연 합주 매칭 시스템</title>
    <style>
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: #f4f6f9; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { color: #2c3e50; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input[type="file"] { display: block; margin-bottom: 15px; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        pre { background-color: #282c34; color: #abb2bf; padding: 15px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; font-family: 'Courier New', monospace; line-height: 1.5; }
        .status { margin-top: 10px; font-weight: bold; color: #e74c3c; text-align: center; }
    </style>
</head>
<body>

    <h1>🎸 목멱성 합주 매칭 자동화 시스템</h1>
    
    <div class="card">
        <p>구글 폼 등에서 다운로드한 <b>응답 CSV 파일</b>을 업로드해 주세요.</p>
        <input type="file" id="csvFileInput" accept=".csv">
        <button id="startBtn" onclick="processFile()">매칭 시뮬레이션 시작</button>
        <div id="statusText" class="status"></div>
    </div>

    <pre id="outputLog">여기에 매칭 결과가 출력됩니다...</pre>

    <script>
        const sessionMap = {
            '보컬': 'Vocal', '기타': 'Guitar', '일렉기타': 'Guitar',  
            '베이스': 'Bass', '드럼': 'Drum', '키보드': 'Keyboard'
        };
        const engToKor = {'Vocal': '보컬', 'Guitar': '기타', 'Bass': '베이스', 'Drum': '드럼', 'Keyboard': '키보드'};

        function timeSortKey(t_str) {
            const dayOrder = {'월': 1, '화': 2, '수': 3, '목': 4, '금': 5, '토': 6, '일': 7};
            const parts = t_str.split(' ');
            const day = parts[0];
            const timeVal = parts.length > 1 ? parts[1] : "";
            return [dayOrder[day] || 99, timeVal];
        }

        // CSV 문자열 파싱 (따옴표 처리 포함)
        function parseCSV(csv) {
            const lines = csv.replace(/\r/g, '').trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            const result = [];
            
            for (let i = 1; i < lines.length; i++) {
                let obj = {};
                let currentLine = lines[i];
                let row = [];
                let inQuotes = false;
                let val = '';
                for (let char of currentLine) {
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { row.push(val.trim()); val = ''; }
                    else val += char;
                }
                row.push(val.trim());
                
                headers.forEach((h, idx) => {
                    obj[h] = row[idx] ? row[idx].replace(/^"|"$/g, '').trim() : '';
                });
                result.push(obj);
            }
            return result;
        }

        function log(msg, append=true) {
            const out = document.getElementById('outputLog');
            if(append) out.textContent += msg + '\n';
            else out.textContent = msg + '\n';
        }

        async function processFile() {
            const fileInput = document.getElementById('csvFileInput');
            if (!fileInput.files.length) {
                alert("CSV 파일을 먼저 선택해 주세요.");
                return;
            }

            const btn = document.getElementById('startBtn');
            const statusText = document.getElementById('statusText');
            btn.disabled = true;
            statusText.textContent = "수만 번의 시뮬레이션을 돌리는 중입니다. 잠시만 기다려주세요...";
            log("데이터를 읽는 중...", false);

            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = async function(e) {
                const text = e.target.result;
                const parsedData = parseCSV(text);
                
                let studentData = {};
                parsedData.forEach(row => {
                    if(!row['이름']) return;
                    let name = row['이름'].trim();
                    let rawSessions = row['세션'].split(',');
                    let sessions = [];
                    rawSessions.forEach(s => {
                        let cleanS = s.trim();
                        if (sessionMap[cleanS]) sessions.push(sessionMap[cleanS]);
                    });
                    
                    studentData[name] = {
                        sessions: [...new Set(sessions)],
                        times: row['시간대'].split(',').map(t => t.trim())
                    };
                });

                // 브라우저가 멈추지 않도록 비동기 처리(setTimeout)로 연산 스레드 분리
                setTimeout(() => runAlgorithm(studentData), 100);
            };
            reader.readAsText(file);
        }

        function runAlgorithm(studentData, iterations=20000) {
            let allTimesSet = new Set();
            let allRequests = new Set();
            let studentNames = Object.keys(studentData);
            
            studentNames.forEach(s => {
                studentData[s].times.forEach(t => allTimesSet.add(t));
                studentData[s].sessions.forEach(r => allRequests.add(`${s}|${r}`));
            });
            
            let allPossibleTimes = Array.from(allTimesSet).sort((a, b) => {
                let keyA = timeSortKey(a), keyB = timeSortKey(b);
                if(keyA[0] !== keyB[0]) return keyA[0] - keyB[0];
                return keyA[1].localeCompare(keyB[1]);
            });

            let bestScore = -Infinity;
            let bestAssignment = {};
            let bestFulfilled = new Set();
            let bestAssignmentCounts = {};

            log(`==============================`, false);
            log(`[데이터 확인]`);
            log(` - 총 지원자 수: ${studentNames.length}명`);
            log(` - 총 신청 세션 수: ${allRequests.size}건`);
            log(`==============================\n`);
            log(`[시스템] 탐색 시작`);
            log(`[시스템] 총 ${iterations}회 시뮬레이션 (약 2~4초 소요)\n`);

            for (let seed = 0; seed < iterations; seed++) {
                let timesShuffled = [...allPossibleTimes];
                
                if (seed % 2 === 0) {
                    timesShuffled.sort(() => Math.random() - 0.5);
                } else {
                    timesShuffled.sort(() => Math.random() - 0.5);
                }

                let fulfilledRequests = new Set();
                let studentAssignmentCount = {};
                studentNames.forEach(s => studentAssignmentCount[s] = 0);
                let results = {};

                for (let t of timesShuffled) {
                    let team = {'Vocal': [], 'Guitar': [], 'Bass': [], 'Drum': [], 'Keyboard': []};
                    let assignedInT = new Set();
                    
                    let roleOrder = ['Drum', 'Bass', 'Vocal', 'Guitar'];
                    roleOrder.sort(() => Math.random() - 0.5);
                    
                    for (let role of roleOrder) {
                        let cands = studentNames.filter(s => 
                            studentData[s].times.includes(t) && 
                            studentData[s].sessions.includes(role) && 
                            !assignedInT.has(s)
                        );
                        
                        if (cands.length > 0) {
                            cands.sort((a, b) => {
                                let valA = [
                                    fulfilledRequests.has(`${a}|${role}`) ? 1 : 0,
                                    studentAssignmentCount[a],
                                    studentData[a].times.length,
                                    Math.random()
                                ];
                                let valB = [
                                    fulfilledRequests.has(`${b}|${role}`) ? 1 : 0,
                                    studentAssignmentCount[b],
                                    studentData[b].times.length,
                                    Math.random()
                                ];
                                for(let i=0; i<4; i++) {
                                    if(valA[i] !== valB[i]) return valA[i] - valB[i];
                                }
                                return 0;
                            });
                            
                            let chosen = cands[0];
                            team[role].push(chosen);
                            assignedInT.add(chosen);
                            fulfilledRequests.add(`${chosen}|${role}`);
                            studentAssignmentCount[chosen]++;
                        } else {
                            team[role].push("(공석)");
                        }
                    }

                    for (let optRole of ['Keyboard', 'Guitar']) {
                        let cands = studentNames.filter(s => 
                            studentData[s].times.includes(t) && 
                            studentData[s].sessions.includes(optRole) && 
                            !assignedInT.has(s)
                        );
                        if (cands.length > 0) {
                            cands.sort((a, b) => {
                                let valA = [
                                    fulfilledRequests.has(`${a}|${optRole}`) ? 1 : 0,
                                    studentAssignmentCount[a],
                                    Math.random()
                                ];
                                let valB = [
                                    fulfilledRequests.has(`${b}|${optRole}`) ? 1 : 0,
                                    studentAssignmentCount[b],
                                    Math.random()
                                ];
                                for(let i=0; i<3; i++) {
                                    if(valA[i] !== valB[i]) return valA[i] - valB[i];
                                }
                                return 0;
                            });
                            let chosen = cands[0];
                            team[optRole].push(chosen);
                            assignedInT.add(chosen);
                            fulfilledRequests.add(`${chosen}|${optRole}`);
                            studentAssignmentCount[chosen]++;
                        }
                    }
                    results[t] = [team];
                }

                let zeroAssignedStudents = studentNames.filter(s => studentAssignmentCount[s] === 0).length;
                let emptyMandatorySlots = 0;
                Object.values(results).forEach(tTeams => {
                    ['Vocal', 'Guitar', 'Bass', 'Drum'].forEach(role => {
                        tTeams[0][role].forEach(m => { if(m === "(공석)") emptyMandatorySlots++; });
                    });
                });

                let fulfilledCount = fulfilledRequests.size;
                let score = (fulfilledCount * 10) - (emptyMandatorySlots * 500) - (zeroAssignedStudents * 10000);

                if (score > bestScore) {
                    bestScore = score;
                    bestAssignment = results;
                    bestFulfilled = new Set(fulfilledRequests);
                    bestAssignmentCounts = {...studentAssignmentCount};
                }
            }

            printResults(bestAssignment, bestFulfilled, allRequests, bestAssignmentCounts, allPossibleTimes, studentNames);
        }

        function printResults(results, fulfilled, allRequests, counts, allTimes, studentNames) {
            let zeroMembers = studentNames.filter(s => counts[s] === 0);
            let totalEmptySlots = 0;
            Object.values(results).forEach(tTeams => {
                Object.values(tTeams[0]).forEach(rList => {
                    rList.forEach(m => { if(m === "(공석)") totalEmptySlots++; });
                });
            });

            let unfulfilledMap = {};
            allRequests.forEach(req => {
                if(!fulfilled.has(req)) {
                    let [name, role] = req.split('|');
                    if(!unfulfilledMap[name]) unfulfilledMap[name] = [];
                    unfulfilledMap[name].push(engToKor[role]);
                }
            });

            log(`\n==============================`);
            log(`최종 배정 결과`);
            log(`==============================`);
            log(`팀 개수: ${Object.keys(results).length}팀`);
            log(`총 ${allRequests.size}건 중 ${fulfilled.size}건 배정`);

            if (zeroMembers.length > 0) log(`\n배정되지 않은 부원: ${zeroMembers.join(', ')}`);
            else log(`\n전원 1회 이상 배정 완료`);

            if (totalEmptySlots > 0) log(`일부 시간대에 지원자가 존재하지 않아 총 ${totalEmptySlots}자리 공석 발생`);

            if (Object.keys(unfulfilledMap).length > 0) {
                log(`\n미배정 세션 내역`);
                for (const [student, roles] of Object.entries(unfulfilledMap)) {
                    log(`   - ${student}: ${roles.join(', ')}`);
                }
            }
            log(`==============================`);

            allTimes.forEach(t => {
                let teams = results[t];
                log(`\n[${t}]`);
                teams.forEach(team => {
                    log(`    - 보컬: ${team['Vocal'].join(', ')}`);
                    log(`    - 기타: ${team['Guitar'].join(', ')}`);
                    log(`    - 베이스: ${team['Bass'].join(', ')}`);
                    log(`    - 드럼: ${team['Drum'].join(', ')}`);
                    if(team['Keyboard'].length > 0) log(`    - 키보드: ${team['Keyboard'].join(', ')}`);
                });
            });

            document.getElementById('startBtn').disabled = false;
            document.getElementById('statusText').textContent = "매칭 완료!";
        }
    </script>
</body>
</html>
